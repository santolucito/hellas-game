<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Hellas - Greek Strategy</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a1a2e;
      touch-action: none;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #game-container {
      width: 100%;
      height: 100%;
      position: relative;
    }
    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #hud {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(180deg, rgba(0,0,0,0.7) 0%, transparent 100%);
      color: #f0e6d2;
      font-size: 16px;
      pointer-events: none;
    }
    #hud > * {
      pointer-events: auto;
    }
    .hud-left, .hud-right {
      display: flex;
      gap: 16px;
      align-items: center;
    }
    .resource {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    #controls {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
      gap: 12px;
      background: linear-gradient(0deg, rgba(0,0,0,0.7) 0%, transparent 100%);
    }
    .btn {
      padding: 12px 24px;
      font-size: 16px;
      font-weight: 600;
      border: 2px solid #c9a227;
      background: rgba(201, 162, 39, 0.2);
      color: #f0e6d2;
      border-radius: 8px;
      cursor: pointer;
      touch-action: manipulation;
      transition: all 0.2s;
    }
    .btn:active {
      background: rgba(201, 162, 39, 0.5);
      transform: scale(0.95);
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    #tooltip {
      position: absolute;
      background: rgba(0,0,0,0.85);
      color: #f0e6d2;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 14px;
      pointer-events: none;
      display: none;
      max-width: 200px;
      border: 1px solid #555;
    }
    #debug {
      position: absolute;
      top: 50px;
      right: 10px;
      background: rgba(0,0,0,0.8);
      color: #0f0;
      padding: 8px;
      font-family: monospace;
      font-size: 12px;
      border-radius: 4px;
      display: none;
    }
    #debug.visible {
      display: block;
    }
    #unit-panel {
      position: absolute;
      bottom: 80px;
      left: 16px;
      background: rgba(0,0,0,0.85);
      color: #f0e6d2;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 14px;
      min-width: 160px;
      border: 2px solid #c9a227;
      display: none;
    }
    #unit-panel.visible {
      display: block;
    }
    #unit-panel .unit-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(201,162,39,0.4);
    }
    #unit-panel .unit-icon {
      font-size: 28px;
    }
    #unit-panel .unit-name {
      font-size: 18px;
      font-weight: 600;
      color: #c9a227;
    }
    #unit-panel .unit-stats {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 4px 12px;
    }
    #unit-panel .stat-label {
      color: #999;
    }
    #unit-panel .stat-value {
      text-align: right;
      font-weight: 500;
    }
    #unit-panel .hp-bar {
      height: 8px;
      background: rgba(0,0,0,0.5);
      border-radius: 4px;
      margin-top: 10px;
      overflow: hidden;
    }
    #unit-panel .hp-bar-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.3s;
    }
    #unit-panel .status-row {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(201,162,39,0.4);
      font-size: 12px;
      color: #888;
    }
    #unit-panel .status-row .can-act {
      color: #7ec850;
    }
    #unit-panel .status-row .cannot-act {
      color: #f25c54;
    }
    #victory-screen {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.9);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #f0e6d2;
      z-index: 100;
    }
    #victory-screen.visible {
      display: flex;
    }
    #victory-screen h1 {
      font-size: 32px;
      margin-bottom: 20px;
      color: #c9a227;
    }
    #victory-screen p {
      font-size: 18px;
      margin-bottom: 30px;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>
    <div id="hud">
      <div class="hud-left">
        <span class="resource"><span id="drachma">0</span> Δρχ <span id="income" style="color:#7ec850;"></span></span>
        <span class="resource">⚔ <span id="unit-count">0</span></span>
      </div>
      <div class="hud-right">
        <span>Turn <span id="turn-num">1</span></span>
      </div>
    </div>
    <div id="controls">
      <button class="btn" id="btn-menu">Menu</button>
      <button class="btn" id="btn-tech">Tech</button>
      <button class="btn" id="btn-end-turn">End Turn</button>
    </div>
    <div id="tooltip"></div>
    <div id="unit-panel">
      <div class="unit-header">
        <span class="unit-icon" id="unit-icon">⚔</span>
        <div style="display:flex;flex-direction:column;">
          <span class="unit-name" id="unit-name">Ὁπλίτης</span>
          <span id="unit-name-sub" style="font-size:11px;color:#a0a0a0;">Hoplitēs — Hoplite</span>
        </div>
      </div>
      <div class="unit-stats">
        <span class="stat-label">HP</span>
        <span class="stat-value" id="unit-hp">10/10</span>
        <span class="stat-label">Attack</span>
        <span class="stat-value" id="unit-attack">3</span>
        <span class="stat-label">Defense</span>
        <span class="stat-value" id="unit-defense">2</span>
        <span class="stat-label">Movement</span>
        <span class="stat-value" id="unit-movement">2/2</span>
      </div>
      <div class="hp-bar">
        <div class="hp-bar-fill" id="unit-hp-bar" style="width:100%;background:#7ec850;"></div>
      </div>
      <div class="status-row">
        <span id="unit-status">Ready to move</span>
      </div>
    </div>
    <div id="debug">
      <div>FPS: <span id="debug-fps">0</span></div>
      <div>Seed: <span id="debug-seed">-</span></div>
      <div>Tile: <span id="debug-tile">-</span></div>
      <div>Turn: <span id="debug-turn">-</span></div>
    </div>
    <div id="victory-screen">
      <h1 id="victory-title">Victory!</h1>
      <p id="victory-message">You have conquered the enemy!</p>
      <div id="victory-stats" style="text-align:left;margin-bottom:20px;padding:15px;background:rgba(255,255,255,0.1);border-radius:8px;"></div>
      <button class="btn" id="btn-restart">Play Again</button>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
